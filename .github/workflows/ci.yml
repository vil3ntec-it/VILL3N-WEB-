name: آزمون‌ها

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: سایتِ vill3n
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ⚠️ کنترول سنتر از روی همین release.json نسخهٔ تازه را می‌گیرد؛ اگر با فایل‌ها نخواند، به‌روزرسانی شکست می‌خورد
      - name: فهرستِ نسخه (release.json)
        run: node scripts/make-release.js --check
      - name: آزمون‌ها
        run: npm test
